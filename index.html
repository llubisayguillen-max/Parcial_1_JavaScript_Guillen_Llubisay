<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tareas Estudiantiles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="bg-light">
    
    <div class="container-fluid py-4">

        <h1 class="text-center mb-5 fw-bold titulo-principal "><i class="bi bi-journal-text"></i></i>Tareas Estudiantiles</h1>

            <div id="app">

            <div class="container-fluid py-4">
                
                <div class="row">

                    <div class="col-md-5 mb-4">

                        <div class="card shadow-sm border-0">
                            
                            <div class="card-header bg-primary text-white text-center">
                                <h4 class="mb-0"><i class="bi bi-list-stars"></i> Gestión de Tareas</h4>
                            </div>

                            <div class="card-body">

                                <div class="input-group mb-4">
                                    <input 
                                        type="text" 
                                        id="inputTarea" 
                                        class="form-control"
                                        placeholder="Ingresar tarea"
                                    >

                                    <button id="btnAgregar" class="btn btn-primary">Agregar</button>
                                </div>

                                <div class="card border-warning">
                                    <div class="card-header bg-warning text-center">
                                        <i class="bi bi-lightbulb-fill"></i>
                                        <strong>Pendientes</strong>
                                    </div>

                                    <ul id="listaTareas" class="list-group list-group-flush"></ul>
                                </div>

                            </div>

                        </div>

                    </div>

        <div class="col-md-7">

            <div class="card shadow-sm border-0">

                <div class="card-header bg-dark text-white text-center">
                    <h4 class="mb-0">Estado de Tareas</h4>
                </div>

                <div class="card-body">

                    <div class="input-group mb-4">
                        <input 
                            type="text" 
                            id="buscador"
                            class="form-control"
                            placeholder="Buscar tarea..."
                        >

                        <button id="btnBuscar" class="btn btn-secondary">Buscar</button>
                    </div>

                    <div class="table-responsive">
                        <table class="table table-bordered table-hover align-middle text-center">
                            <thead class="table-dark">
                                <tr>
                                    <th>Tarea</th>
                                    <th>Iniciada</th>
                                    <th>En Progreso</th>
                                    <th>Finalizada</th>
                                </tr>
                            </thead>

                            <tbody id="tablaTareas"></tbody>
                        </table>
                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</div>


    </div>

    <script src="js/app.js"></script>

</body>
</html>
